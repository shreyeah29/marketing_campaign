name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vsp_marketing_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vsp_marketing_test
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vsp_marketing_test
      REDIS_URL: redis://localhost:6379
      APP_DATABASE_URL: postgresql://vsp_app:ci-app-password@localhost:5432/vsp_marketing_test
      BETTER_AUTH_SECRET: ci-only-secret-value-at-least-32-characters
      ENCRYPTION_MASTER_KEY: ci-only-encryption-key-at-least-32-chars

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      # Tenant isolation is the one defect class that becomes a breach, so it is
      # verified against a real PostgreSQL instance on every run — as the
      # application role, which is genuinely subject to row-level security.
      - name: Provision application role
        working-directory: packages/database
        run: psql "$DIRECT_DATABASE_URL" -v app_password="ci-app-password" -f scripts/provision-app-role.sql

      - name: Seed isolation fixtures
        working-directory: packages/database
        run: psql "$DIRECT_DATABASE_URL" -f scripts/seed-isolation-fixtures.sql

      - name: Verify tenant isolation
        working-directory: packages/database
        env:
          PGPASSWORD: ci-app-password
        run: psql -h localhost -U vsp_app -d vsp_marketing_test -v ON_ERROR_STOP=1 -f scripts/verify-tenant-isolation.sql

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  migration-safety:
    name: Migration drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Fails if schema.prisma changed without a migration. The previous .NET
      # implementation used EnsureCreated and could not evolve a schema at all.
      #
      # Not a bare `migrate diff --exit-code`: RLS policies, functions, triggers
      # and pgvector/trigram indexes cannot be expressed in the Prisma datamodel,
      # so that would be red on every run and would end up disabled. The script
      # allowlists those specific objects and fails on everything else.
      - name: Verify schema matches migrations
        run: pnpm --filter @vsp/database run migrate:check
